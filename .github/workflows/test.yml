name: Tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '3.3', padrino: '~> 0.15.0', grape: '~> 2.4', sinatra: '~> 2.2' }
          - { ruby: '3.3', padrino: '~> 0.16.0', grape: '~> 3.2.0', sinatra: '~> 4.0' }
          - { ruby: '3.4', padrino: '~> 0.17.0', grape: '~> 3.2.0', sinatra: '~> 4.0' }
          - { ruby: '4.0', padrino: '~> 0.17.0', grape: '~> 3.2.0', sinatra: '~> 4.0' }
    name: Ruby ${{ matrix.entry.ruby }} / Padrino ${{ matrix.entry.padrino }}
    env:
      PADRINO_VERSION: ${{ matrix.entry.padrino }}
      GRAPE_VERSION: ${{ matrix.entry.grape }}
      SINATRA_VERSION: ${{ matrix.entry.sinatra }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the selected Padrino version instead of the application lockfile
        run: rm Gemfile.lock
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          format: lcov
          flag-name: ruby-${{ matrix.entry.ruby }}-padrino-${{ strategy.job-index }}
          parallel: true
  finish:
    name: Finish Coveralls
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
